configuration:
  timezone:
    name: Timezone
    description: IANA timezone used for calendar rendering.
  viewer_password:
    name: Viewer password
    description: Password for the dashboard display.
  admin_password:
    name: Administrator password
    description: Password for calendar administration.
  google_client_id:
    name: Google client ID
  google_client_secret:
    name: Google client secret
  external_url:
    name: Private HTTPS dashboard URL
    description: Exact Tailscale HTTPS origin used for the Google OAuth callback.
  google_refresh_token:
    name: Google refresh token
  openai_api_key:
    name: OpenAI API key
    description: Optional key for calendar coordination.
  calendar_openai_model:
    name: OpenAI model
    description: Legacy fallback model used only when the new model options are unset.
  calendar_curation_model:
    name: Calendar curation model
    description: Optional model for grouping, filtering, and formatting visible events.
  calendar_summary_model:
    name: Calendar summary model
    description: Optional model for the one-sentence daily summary.
