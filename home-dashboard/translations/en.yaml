configuration:
  timezone:
    name: Time zone
    description: IANA time zone used for household calendar times.
  google_client_id:
    name: Google OAuth client ID
  google_client_secret:
    name: Google OAuth client secret
  external_url:
    name: Private HTTPS dashboard URL
    description: Exact Tailscale HTTPS origin used for the Google OAuth callback.
  google_refresh_token:
    name: Google Calendar refresh token
  openai_api_key:
    name: OpenAI API key
    description: Optional. Enables AI calendar display projections.
network:
  8080/TCP: Dashboard web interface (LAN only)
  calendar_daily_call_limit:
    name: Daily model call limit
    description: Model calls allowed per day before the dashboard falls back to the raw calendar. 0 removes the ceiling.
  calendar_daily_token_limit:
    name: Daily model token limit
    description: Tokens allowed per day before the dashboard falls back to the raw calendar. 0 removes the ceiling.
