name: Home Dashboard
version: 0.2.61
slug: home_dashboard
description: Fullscreen household calendar dashboard for a local Android display.
url: https://github.com/brooksn/home-dashboard-ha
image: ghcr.io/brooksn/home-dashboard
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# The Home Assistant base image supplies s6-overlay as PID 1.
init: false
# The server uses the Supervisor-managed Core API proxy only to restart the
# fixed ApoloSign touch-presence script. The token never reaches the browser.
homeassistant_api: true
webui: http://[HOST]:[PORT:8080]/
ports:
  8080/tcp: 8088
ports_description:
  8080/tcp: Dashboard web interface (plain HTTP; use a private Tailscale Service for HTTPS)
options:
  timezone: America/Los_Angeles
  external_url: ""
  calendar_daily_call_limit: 400
  calendar_daily_token_limit: 400000
schema:
  timezone: str
  google_client_id: str
  google_client_secret: password
  external_url: str?
  google_refresh_token: password?
  openai_api_key: password?
  calendar_daily_call_limit: int?
  calendar_daily_token_limit: int?
stage: experimental
