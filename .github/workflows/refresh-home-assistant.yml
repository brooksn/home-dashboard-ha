name: Refresh Home Assistant app updates

on:
  push:
    branches: [main]
    paths:
      - home-dashboard/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: home-dashboard-install
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HOME_ASSISTANT_URL: ${{ secrets.HOME_ASSISTANT_URL }}
      HOME_ASSISTANT_TOKEN: ${{ secrets.HOME_ASSISTANT_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read expected app version
        run: echo "value=$(awk '/^version:/{print $2; exit}' home-dashboard/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: configuration
        name: Check private connection configuration
        shell: bash
        run: |
          if [[ -n "$HOME_ASSISTANT_URL" && -n "$HOME_ASSISTANT_TOKEN" && -n "$TS_OAUTH_CLIENT_ID" && -n "$TS_AUDIENCE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Home Assistant install requires the documented GitHub Secrets."
          fi
      - name: Join the tailnet
        if: steps.configuration.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - id: install
        name: Discover and install Home Dashboard
        if: steps.configuration.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          api_base="${HOME_ASSISTANT_URL%/}/api"
          entity_id="update.home_dashboard_update"

          refresh_update() {
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"entity_id\":\"${entity_id}\"}" \
              "${api_base}/services/homeassistant/update_entity" >/dev/null
          }

          update_state() {
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
              "${api_base}/states/${entity_id}"
          }

          latest=""
          for attempt in {1..60}; do
            if (( attempt == 1 || (attempt - 1) % 5 == 0 )); then
              refresh_update
            fi
            state=$(update_state)
            installed=$(jq -r '.attributes.installed_version // empty' <<<"$state")
            latest=$(jq -r '.attributes.latest_version // empty' <<<"$state")
            echo "discovery ${attempt}/60: installed=${installed:-unknown} latest=${latest:-unknown} expected=${EXPECTED_VERSION}"
            if [[ "$installed" == "$EXPECTED_VERSION" ]]; then
              exit 0
            fi
            if [[ "$latest" == "$EXPECTED_VERSION" ]]; then
              break
            fi
            sleep 3
          done

          if [[ "$latest" != "$EXPECTED_VERSION" ]]; then
            echo "Home Assistant did not discover ${EXPECTED_VERSION}" >&2
            exit 1
          fi

          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $HOME_ASSISTANT_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"entity_id\":\"${entity_id}\"}" \
            "${api_base}/services/update/install" >/dev/null

          for attempt in {1..100}; do
            state=$(update_state)
            installed=$(jq -r '.attributes.installed_version // empty' <<<"$state")
            latest=$(jq -r '.attributes.latest_version // empty' <<<"$state")
            echo "installation ${attempt}/100: installed=${installed:-unknown} latest=${latest:-unknown} expected=${EXPECTED_VERSION}"
            if [[ "$installed" == "$EXPECTED_VERSION" ]]; then
              exit 0
            fi
            sleep 3
          done

          echo "Home Assistant did not install ${EXPECTED_VERSION}" >&2
          exit 1

      - id: reporting-configuration
        if: always()
        name: Check deployment reporting configuration
        env:
          APP_CLIENT_ID: ${{ vars.DEPLOYMENT_STATUS_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEPLOYMENT_STATUS_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment reporting skipped because its GitHub App credentials are incomplete."
          fi
      - id: reporter-token
        if: always() && steps.reporting-configuration.outputs.configured == 'true'
        name: Create deployment-status token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOYMENT_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYMENT_STATUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: home-dashboard
          permission-deployments: write
      - name: Report final deployment status
        if: always() && steps.reporting-configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.reporter-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.value }}
          HA_CONFIGURED: ${{ steps.configuration.outputs.configured }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          deployment_id=""
          for attempt in {1..30}; do
            deployment_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY_OWNER}/home-dashboard/deployments?ref=v${VERSION}&environment=Home%20Assistant&per_page=1" --jq '.[0].id // empty')
            [[ -n "$deployment_id" ]] && break
            sleep 2
          done

          if [[ -z "$deployment_id" ]]; then
            echo "No Home Assistant deployment found for v${VERSION}; status reporting skipped." >&2
            exit 0
          fi

          if [[ "$HA_CONFIGURED" == "true" && "$INSTALL_OUTCOME" == "success" ]]; then
            state=success
            description="Home Assistant installed Home Dashboard v${VERSION}."
          elif [[ "$HA_CONFIGURED" != "true" ]]; then
            state=failure
            description="Home Assistant connection is not configured."
          else
            state=failure
            description="Home Assistant did not install Home Dashboard v${VERSION}."
          fi

          payload=$(jq -n --arg state "$state" --arg description "$description" --arg log_url "$LOG_URL" '{
            state: $state,
            description: $description,
            log_url: $log_url,
            auto_inactive: false
          }')
          gh api --method POST "repos/${GITHUB_REPOSITORY_OWNER}/home-dashboard/deployments/${deployment_id}/statuses" --input - <<<"$payload"
      - name: Fail unsuccessful installation
        if: always()
        env:
          HA_CONFIGURED: ${{ steps.configuration.outputs.configured }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          [[ "$HA_CONFIGURED" == "true" && "$INSTALL_OUTCOME" == "success" ]]
